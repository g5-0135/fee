<!DOCTYPE html>

<html>
<head>
    <title>Hello World Card</title>

```
<style>
    body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    .card {
        background: white;
        padding: 40px;
        width: 300px;
        text-align: center;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    h1 {
        color: #764ba2;
    }

    p {
        color: #555;
        font-size: 18px;
    }

    button {
        background: #764ba2;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background: #512b81;
    }
</style>
```

</head>

<body>

```
<div class="card">
    <h1 id="heading"></h1>
    <p id="message"></p>
    <button onclick="showMessage()">Click Me</button>
</div>

<script>
    document.getElementById("heading").innerHTML = "Hello World!";

    document.getElementById("message").innerHTML = "My name is Ruhaan";

    function showMessage() {
        alert("Welcome Ruhaan!");
    }
</script>
```

</body>
</html>
